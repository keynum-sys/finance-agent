[project]
name = "finance-agent"
version = "0.1.0"
description = "A-share financial report analysis agent with traceable, source-cited conclusions"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "akshare>=1.15",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "httpx>=0.27",
    "openai>=1.60",
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "langfuse>=2.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
